name: Deploy Invoice System

on:
  push:
    branches:
      - main # تأكد أن هذا هو اسم فرعك الرئيسي (Main او Master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/invoice-backend

            # تفعيل وضع الصيانة مؤقتاً
            php artisan down || true

            # سحب الكود الجديد من جيتهاب
            git pull origin main

            # تحديث مكتبات Composer مع تخطي قيود إصدار PHP للمنصة
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs

            # تحديث قاعدة البيانات والكاش
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # إنهاء وضع الصيانة
            php artisan up
