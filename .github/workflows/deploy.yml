name: Deploy Invoice System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/invoice-backend

            # حل جذري للصلاحيات: تملك المجلد وإصلاح أذونات التخزين فوراً
            sudo chown -R ubuntu:www-data .
            sudo chmod -R 775 storage bootstrap/cache

            # تفعيل وضع الصيانة مؤقتاً
            php artisan down || true

            # سحب الكود الجديد
            git pull origin main

            # حل جذري للـ Composer: تخطي فحص المنصة تماماً لتفادي تعارض PHP 8.5
            composer install --no-dev --optimize-autoloader --ignore-platform-reqs

            # تحديث قاعدة البيانات وتنظيف الكاش
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # إعادة إصلاح الصلاحيات للملفات الجديدة التي تولدت عن الكاش
            sudo chmod -R 775 storage bootstrap/cache

            # إنهاء وضع الصيانة
            php artisan up
