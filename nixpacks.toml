[phases.setup]
nixPkgs = ["php82", "php82Extensions.gd", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.tokenizer", "php82Extensions.bcmath", "php82Extensions.zip", "composer"]

[phases.build]
cmds = ["composer install --optimize-autoloader --no-dev --no-interaction --ignore-platform-req=ext-gd"]

[phases.deploy]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
